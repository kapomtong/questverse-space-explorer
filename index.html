<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuestVerse — Space Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
    <!-- จอโหลดเริ่มต้น -->
    <div id="preloader">
        <img src="assets/explorer_ship.webp" alt="Explorer Ship" class="preloader-ship">
        <p class="preloader-text">กำลังเตรียมยานสำรวจ...</p>
    </div>

    <!-- Container หลักของแอป -->
    <div id="app"></div>

    <!-- โหลด JavaScript modules ตามลำดับ -->
    <script src="js/config.js?v=10"></script>
    <script src="js/app.js?v=10"></script>
    <script src="js/landing.js?v=10"></script>
    <script src="js/character.js?v=10"></script>
    <script src="js/game_state.js?v=10"></script>
    <script src="js/questions.js?v=10"></script>
    <script src="js/galaxy_map.js?v=10"></script>
    <script src="js/mission.js?v=10"></script>
    <script src="js/minigame.js?v=10"></script>
  <script src="js/boss.js?v=10"></script>
    <script src="js/bossHall.js?v=10"></script>
    <script src="js/timeAttack.js?v=10"></script>
    <script src="js/leaderboard.js?v=10"></script>

    <!-- ซ่อน preloader เมื่อโหลดเสร็จ -->
    <script>
        window.addEventListener('load', function() {
            const preloader = document.getElementById('preloader');
            preloader.style.opacity = '0';
            setTimeout(() => {
                preloader.style.display = 'none';
            }, 500);
        });
    </script>
</body>
</html>
